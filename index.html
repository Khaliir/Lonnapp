<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><meta name="description" content="Privat lønnsoversikt med turnus og månedsregistrering"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Min lønnsoversikt</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#183047;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#102a43;color:white;padding:18px 22px}header h1{margin:0;font-size:1.35rem}header small{color:#cbd5e1}main{max-width:1100px;margin:auto;padding:18px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}button,select,input{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:#e4ebf3;color:#183047}button.active,.primary{background:#1263a0;color:white}.card{background:white;border:1px solid #dce4ec;border-radius:14px;padding:17px;margin-bottom:14px;box-shadow:0 2px 10px #102a4310}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.stat{background:#f2f7fb;padding:14px;border-radius:10px}.stat strong{display:block;font-size:1.4rem;margin-top:5px}label{display:block;font-size:.9rem;font-weight:600;margin-bottom:5px}input,select{width:100%;padding:10px;border:1px solid #b9c7d5;border-radius:8px;background:white}h2{margin:0 0 15px;font-size:1.15rem}h3{margin:10px 0}.muted{color:#627488;font-size:.9rem}.field{margin-bottom:12px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row>*{flex:1}.row button{flex:0 0 auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:10px;border-bottom:1px solid #e1e8ef;text-align:right}th:first-child,td:first-child{text-align:left}.scroll{overflow:auto}.pill{display:inline-block;background:#dff4e6;padding:3px 8px;border-radius:20px}.warning{background:#fff7df;border-left:4px solid #d69c20;padding:12px;border-radius:6px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{padding:8px 3px;text-align:center;background:#edf2f7;border-radius:7px;font-size:.85rem}.day.work{background:#cce6ff;color:#074b7b;font-weight:700}.day.blank{background:transparent}.day.vacation{background:#ffe0ae;color:#754500;font-weight:700}#vacationList button{margin:3px;padding:6px 9px}.day small
